<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
   <link rel="stylesheet" href="./style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="card">
<div class="card-image">
  <img src="./images/image-product-desktop.jpg" alt="Perfume bottle">
</div>

<div class="card-content"> 
  <p class="category">Perfume</p>

  <h1 class="name">Gabrielle Essence Eau De Parfum</h1> 

  <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>
</div>
<div class="prices"> 
  <p class="new-price">$149.99</p>
  <span class="former-price">$169.99</span>
</div>
<div> 
  <button>Add to Cart</button>
  </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Labake</a>.
  </footer>
</body>
</html>
